name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
      - dev/alex
  workflow_dispatch:
    inputs:
      deploy_message:
        description: 'Deployment message'
        required: false
        default: 'Manual deployment'

jobs:
  build-and-deploy:
    name: Build Docker Image and Deploy to Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Generate image tag
        id: image_tag
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "TAG=chatgpt-next-web:${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "LATEST_TAG=chatgpt-next-web:latest" >> $GITHUB_OUTPUT
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.image_tag.outputs.TAG }},${{ steps.image_tag.outputs.LATEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/docker-image.tar
      
      - name: Copy Docker image to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "/tmp/docker-image.tar"
          target: "/tmp"
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Load Docker image
            echo "Loading Docker image..."
            docker load -i /tmp/docker-image.tar
            
            # Clean up transferred image file
            rm -f /tmp/docker-image.tar
            
            # Navigate to project directory
            cd ${{ secrets.PROJECT_DIR }}
            
            # Create .env file with secrets
            cat > .env <<EOF
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            CODE=${{ secrets.CODE }}
            BASE_URL=${{ secrets.BASE_URL }}
            OPENAI_ORG_ID=${{ secrets.OPENAI_ORG_ID }}
            HIDE_USER_API_KEY=${{ secrets.HIDE_USER_API_KEY }}
            DISABLE_GPT4=${{ secrets.DISABLE_GPT4 }}
            ENABLE_BALANCE_QUERY=${{ secrets.ENABLE_BALANCE_QUERY }}
            DISABLE_FAST_LINK=${{ secrets.DISABLE_FAST_LINK }}
            OPENAI_SB=${{ secrets.OPENAI_SB }}
            PROXY_URL=${{ secrets.PROXY_URL }}
            EOF
            
            # Stop and remove existing containers
            echo "Stopping existing containers..."
            docker-compose down || true
            
            # Remove old images (keep last 3 versions)
            echo "Cleaning up old images..."
            docker images | grep chatgpt-next-web | tail -n +4 | awk '{print $3}' | xargs -r docker rmi -f || true
            
            # Update docker-compose.yml to use local image
            cat > docker-compose.yml <<'COMPOSE'
            version: "3.9"
            services:
              chatgpt-next-web:
                container_name: chatgpt-next-web
                image: chatgpt-next-web:latest
                ports:
                  - "3000:3000"
                env_file:
                  - .env
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:3000"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 40s
            COMPOSE
            
            # Start new container
            echo "Starting new container..."
            docker-compose up -d
            
            # Wait for container to be healthy
            echo "Waiting for container to be healthy..."
            for i in {1..30}; do
              if docker-compose ps | grep -q "healthy"; then
                echo "Container is healthy!"
                break
              fi
              echo "Waiting for container health check... ($i/30)"
              sleep 5
            done
            
            # Show container status
            echo "Container status:"
            docker-compose ps
            
            # Show latest logs
            echo "Latest logs:"
            docker-compose logs --tail=50
      
      - name: Health check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.PROJECT_DIR }}
            if docker-compose ps | grep -q "Up"; then
              echo "✅ Deployment successful! Container is running."
              curl -f http://localhost:3000 > /dev/null 2>&1 && echo "✅ Application is responding." || echo "⚠️ Application might need more time to start."
            else
              echo "❌ Deployment failed! Container is not running."
              docker-compose logs --tail=100
              exit 1
            fi
      
      - name: Cleanup on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.PROJECT_DIR }}
            echo "Deployment failed, checking container status..."
            docker-compose ps
            docker-compose logs --tail=100